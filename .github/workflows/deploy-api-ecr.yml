# ============================================================================
# deploy-api-ecr.yml — build the care1960-prognocis-writeback Docker image and
# push it to Amazon ECR.
#
# Structural reference: allgpt-co/quickintellforpayers
#   .github/workflows/deploy-api-ecr.yml
#
# Adapted for THIS repository's single-container Node/Chromium batch worker:
#   - trigger: push to main + manual `workflow_dispatch` (no Security Audit
#     `workflow_run` handoff, no artifact download)
#   - runner: GitHub-hosted ubuntu-latest (no dependency on QuickScribe's
#     self-hosted runner)
#   - validation gate: the `docker build` itself — the Dockerfile runs
#     `npm run check` (node --check + node --test) in its build stage. No
#     Postgres test container, no Python lint/migrations/pytest, no Coolify
#     webhook: none of those apply to this Node/Chromium batch job.
#   - image build/push only; NO production runtime deployment step.
#
# Repository variables required (never hardcoded here):
#   AWS_ROLE_ARN    — IAM role ARN this workflow assumes via OIDC federation
#   ECR_REPOSITORY  — ECR repository name (registry prefix is resolved at run
#                     time from the ECR login output)
#
# Secrets (.env), active config (config/writeback.json), and PHI-bearing
# runtime state (.runtime/) are excluded from the build context by
# .dockerignore and are never printed or baked into the image.
# ============================================================================

name: Build Writeback Image & Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

defaults:
  run:
    shell: bash

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Validation gate. The Dockerfile's build stage runs
      # `npm run check` (node --check + node --test) against the Playwright
      # Chromium it installs; if that gate fails, the build fails and the job
      # stops here, never reaching AWS. The locally tagged image is only an
      # intermediate artifact — the ECR push happens in a later step.
      - name: Build Docker image
        run: |
          docker build -t care1960-prognocis-writeback:${GITHUB_SHA} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "ECR login successful (registry: ${ECR_REGISTRY})"
          echo "Image repository: ${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "Image tag: ${IMAGE_TAG}"

          docker tag "care1960-prognocis-writeback:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "care1960-prognocis-writeback:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Pushing ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} ..."
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Pushed ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Pushing ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest ..."
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "Pushed ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      # Failure-safe local cleanup: drop the intermediate local image tag from
      # the (ephemeral) runner even when a step above failed. The ECR images
      # are production artifacts and are NEVER removed by this workflow.
      - name: Clean up local build image
        if: always()
        run: |
          docker image rm -f "care1960-prognocis-writeback:${GITHUB_SHA}" >/dev/null 2>&1 || true